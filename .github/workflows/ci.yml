name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Run vet (linting)
        working-directory: backend
        run: |
          go vet ./...

      - name: Run tests
        working-directory: backend
        run: |
          go test -v ./...

      - name: Build Go binary
        working-directory: backend
        run: |
          go build -v ./...

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: frontend
        run: |
          pnpm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm run build
