basePath: /
definitions:
  db.QuestionType:
    enum:
    - multiple_choice
    - true_false
    type: string
    x-enum-varnames:
    - QuestionTypeMultipleChoice
    - QuestionTypeTrueFalse
  handler.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handler.User'
    type: object
  handler.ChildResponse:
    properties:
      birth_date:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      gender:
        type: string
      home_address:
        type: string
      id:
        type: string
      nik:
        type: string
      parent_id:
        type: string
      updated_at:
        type: string
    type: object
  handler.CreateChildrenRequest:
    properties:
      birth_date:
        type: string
      full_name:
        type: string
      gender:
        type: string
      home_address:
        type: string
      nik:
        type: string
    required:
    - birth_date
    - full_name
    - gender
    - home_address
    - nik
    type: object
  handler.CreateEducationMaterialRequest:
    properties:
      description:
        type: string
      title:
        type: string
      video_url:
        type: string
    required:
    - title
    type: object
  handler.CreateMeasurementRequest:
    properties:
      children_id:
        type: string
      head_circumference:
        type: number
      height:
        type: number
      upper_arm_circumference:
        type: number
      weight:
        type: number
    required:
    - children_id
    - height
    - weight
    type: object
  handler.CreateNotificationRequest:
    properties:
      message:
        type: string
      title:
        type: string
      user_id:
        type: string
    required:
    - message
    - title
    - user_id
    type: object
  handler.CreateQuizQuestionRequest:
    properties:
      correct_ans:
        type: string
      options:
        type: object
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/db.QuestionType'
    required:
    - options
    - question_text
    - question_type
    type: object
  handler.CreateQuizRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handler.CreateQuizSubmissionRequest:
    properties:
      answers:
        type: object
      score:
        type: number
    required:
    - answers
    type: object
  handler.EducationMaterialResponse:
    properties:
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      video_url:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  handler.MeasurementResponse:
    properties:
      age:
        type: number
      children_id:
        type: string
      head_circumference:
        type: number
      height:
        type: number
      id:
        type: string
      measured_at:
        type: string
      measurer_id:
        type: string
      measurer_role:
        type: string
      stunting_status:
        type: string
      upper_arm_circumference:
        type: number
      weight:
        type: number
      z_score:
        type: number
    type: object
  handler.MessageResponse:
    properties:
      message:
        example: operation successful
        type: string
    type: object
  handler.NotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  handler.QuizQuestionResponse:
    properties:
      correct_ans:
        type: string
      id:
        type: string
      options:
        type: object
      question_text:
        type: string
      question_type:
        type: string
      quiz_id:
        type: string
    type: object
  handler.QuizResponse:
    properties:
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.QuizSubmissionResponse:
    properties:
      answers:
        type: object
      id:
        type: string
      kader_id:
        type: string
      quiz_id:
        type: string
      score:
        type: number
      submitted_at:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      name:
        type: string
      nik:
        type: string
      phone_number:
        type: string
      role:
        enum:
        - tenaga_kesehatan
        - kader
        - orang_tua
        type: string
    required:
    - name
    - phone_number
    - role
    type: object
  handler.RequestOTPRequest:
    properties:
      phone_number:
        type: string
    required:
    - phone_number
    type: object
  handler.StatusResponse:
    properties:
      status:
        example: aman
        type: string
    type: object
  handler.UpdateChildRequest:
    properties:
      birth_date:
        type: string
      full_name:
        type: string
      gender:
        type: string
      home_address:
        type: string
      nik:
        type: string
    required:
    - birth_date
    - full_name
    - gender
    - home_address
    - nik
    type: object
  handler.UpdateEducationMaterialRequest:
    properties:
      description:
        type: string
      title:
        type: string
      video_url:
        type: string
    required:
    - title
    type: object
  handler.UpdateMeasurementRequest:
    properties:
      head_circumference:
        type: number
      height:
        type: number
      upper_arm_circumference:
        type: number
      weight:
        type: number
    required:
    - height
    - weight
    type: object
  handler.UpdateProfileRequest:
    properties:
      is_notification_enabled:
        type: boolean
      name:
        type: string
      nik:
        type: string
      phone_number:
        type: string
    required:
    - name
    - phone_number
    type: object
  handler.UpdateQuizQuestionRequest:
    properties:
      correct_ans:
        type: string
      options:
        type: object
      question_text:
        type: string
      question_type:
        $ref: '#/definitions/db.QuestionType'
    required:
    - options
    - question_text
    - question_type
    type: object
  handler.UpdateQuizRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  handler.UploadAvatarResponse:
    properties:
      avatar_url:
        example: https://storage.googleapis.com/...
        type: string
      message:
        example: Avatar uploaded successfully
        type: string
      user:
        $ref: '#/definitions/handler.User'
    type: object
  handler.User:
    properties:
      avatar_url:
        type: string
      id:
        type: string
      is_notification_enabled:
        type: boolean
      name:
        type: string
      nik:
        type: string
      phone_number:
        type: string
      role:
        type: string
    type: object
  handler.VerifyOTPRequest:
    properties:
      otp:
        type: string
      phone_number:
        type: string
    required:
    - otp
    - phone_number
    type: object
info:
  contact: {}
  description: Backend REST API for Centing (Stunting Prevention & Monitoring System).
  title: Centing API
  version: "1.0"
paths:
  /:
    get:
      description: Check server operational status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Health check
      tags:
      - Health
  /education-materials:
    get:
      description: Retrieve paginated list of educational materials
      parameters:
      - description: Limit (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.EducationMaterialResponse'
            type: array
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List education materials
      tags:
      - Education Materials
  /education-materials/{id}:
    get:
      description: Retrieve single education material details by ID
      parameters:
      - description: Education Material ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.EducationMaterialResponse'
        "400":
          description: Invalid education material ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get education material by ID
      tags:
      - Education Materials
  /kader/children:
    get:
      description: Retrieve paginated list of children for Posyandu cadres
      parameters:
      - description: Limit (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ChildResponse'
            type: array
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List children (Kader only)
      tags:
      - Children
  /kader/children/{id}/measurements:
    get:
      description: Retrieve measurement history for a child by Posyandu cadre
      parameters:
      - description: Child ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MeasurementResponse'
            type: array
        "400":
          description: Invalid child ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List measurements by child ID (Kader only)
      tags:
      - Measurements
  /kader/measurements:
    get:
      description: Retrieve measurements recorded by the authenticated Posyandu cadre
      parameters:
      - description: Limit (default 100)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MeasurementResponse'
            type: array
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get measurements recorded by kader (Kader only)
      tags:
      - Measurements
    post:
      consumes:
      - application/json
      description: Record a new child growth measurement by Posyandu cadre
      parameters:
      - description: Create Measurement Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMeasurementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.MeasurementResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create child measurement (Kader only)
      tags:
      - Measurements
  /kader/submissions:
    get:
      description: Retrieve submissions submitted by the authenticated Posyandu cadre
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.QuizSubmissionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List quiz submissions by kader (Kader only)
      tags:
      - Quizzes
  /login/request-otp:
    post:
      consumes:
      - application/json
      description: Request an OTP code sent to the registered phone number
      parameters:
      - description: Request OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Failed to send OTP
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Request OTP for login
      tags:
      - Auth
  /login/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code sent to phone number and receive JWT authentication
        token
      parameters:
      - description: Verify OTP Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Invalid or expired OTP
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Failed to verify OTP
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify OTP and login
      tags:
      - Auth
  /nakes/children:
    get:
      description: Retrieve paginated list of all children across the system
      parameters:
      - description: Limit (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ChildResponse'
            type: array
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all children (Nakes only)
      tags:
      - Children
    post:
      consumes:
      - application/json
      description: Create a new child profile by healthcare worker
      parameters:
      - description: Create Child Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateChildrenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ChildResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create child profile (Nakes only)
      tags:
      - Children
  /nakes/children/{id}:
    delete:
      description: Delete a child record by ID
      parameters:
      - description: Child ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Invalid child ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete child profile (Nakes only)
      tags:
      - Children
    get:
      description: Retrieve single child details by ID
      parameters:
      - description: Child ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChildResponse'
        "400":
          description: Invalid child ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get child by ID (Nakes only)
      tags:
      - Children
    put:
      consumes:
      - application/json
      description: Update details of an existing child record
      parameters:
      - description: Child ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update Child Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateChildRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ChildResponse'
        "400":
          description: Validation error or invalid ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update child profile (Nakes only)
      tags:
      - Children
  /nakes/children/{id}/measurements:
    get:
      description: Retrieve measurement history for a child by healthcare worker
      parameters:
      - description: Child ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MeasurementResponse'
            type: array
        "400":
          description: Invalid child ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List measurements by child ID (Nakes only)
      tags:
      - Measurements
  /nakes/education-materials:
    post:
      consumes:
      - application/json
      description: Create a new stunting education material with title, description,
        and video URL
      parameters:
      - description: Create Education Material Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateEducationMaterialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.EducationMaterialResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create education material (Nakes only)
      tags:
      - Education Materials
  /nakes/education-materials/{id}:
    delete:
      description: Delete an educational material record by ID
      parameters:
      - description: Education Material ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Invalid education material ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: insufficient permissions'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete education material (Nakes only)
      tags:
      - Education Materials
    put:
      consumes:
      - application/json
      description: Update details of an existing educational material record
      parameters:
      - description: Education Material ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update Education Material Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateEducationMaterialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.EducationMaterialResponse'
        "400":
          description: Validation error or invalid ID
          schema:
